name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database:
    name: Migrations on real Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: finken
          POSTGRES_PASSWORD: finken
          POSTGRES_DB: finken
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finken -d finken"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://finken:finken@localhost:5432/finken
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w @finken/api
      - name: Apply migrations twice (the second run must change nothing)
        working-directory: apps/api
        run: |
          node dist/migrate.js
          node dist/migrate.js | grep -q "up to date"
      - name: API starts and reaches the database
        working-directory: apps/api
        run: |
          node dist/server.js &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4000/ready && exit 0; sleep 1; done
          exit 1

  image:
    name: API container builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f apps/api/Dockerfile -t finken-api:ci .
